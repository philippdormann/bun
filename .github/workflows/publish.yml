name: GHCR Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  check_and_update_bun_version:
    name: Check image pins
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check_version.outputs.new_version }}
      latest_version: ${{ steps.check_version.outputs.latest_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check image pins
        id: check_version
        run: ./scripts/bump-versions.sh check

  docker:
    name: Release to GHCR
    needs: check_and_update_bun_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply image pins
        run: ./scripts/bump-versions.sh apply

      - name: Setup Docker emulator
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          ./scripts/smoke-test.sh mini-bun:smoke-amd64 "$EXPECTED"

      - name: Trivy zero-CVE scan amd64
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mini-bun:smoke-amd64'
          format: 'table'
          scanners: 'vuln'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

      - name: Sync Dockerfile pins and docs
        id: sync
        run: ./scripts/bump-versions.sh sync-docs mini-bun:smoke-amd64

      - name: Commit Dockerfile and docs
        uses: EndBug/add-and-commit@v9.1.3
        with:
          add: 'Dockerfile README.MD'
          message: ${{ steps.sync.outputs.commit_message }}

      - name: Build arm64 for testing
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arm64 (minimal — runs under QEMU)
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          VERSION=$(docker run --rm --platform linux/arm64 mini-bun:smoke-arm64 --version)
          echo "arm64 reports: $VERSION"
          [ "$VERSION" = "$EXPECTED" ]

      - name: Compute version aliases
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        id: tags
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          V="${LATEST_VERSION#v}"
          MAJOR="${V%%.*}"
          MINOR="${V%.*}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/philippdormann/bun:latest
            ghcr.io/philippdormann/bun:${{ steps.tags.outputs.major }}
            ghcr.io/philippdormann/bun:${{ steps.tags.outputs.minor }}
            ghcr.io/philippdormann/bun:${{ steps.tags.outputs.version }}
